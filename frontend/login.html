<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accedi - Fast Food Express</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="d-flex flex-column min-vh-100 bg-light">

<header class="main-header bg-white sticky-top py-3 border-bottom shadow-sm" style="z-index: 1040;">
    <div class="container d-flex justify-content-center align-items-center">
        <div class="brand-center text-center">
            <a href="index.html" class="text-decoration-none d-flex align-items-center gap-2" title="Torna alla Home">
                <div class="logo-icon bg-danger text-white rounded-circle d-flex justify-content-center align-items-center" style="width: 45px; height: 45px;">
                    <i class="bi bi-shop fs-4"></i>
                </div>
                <div class="text-start">
                    <h3 class="m-0 fw-bold text-dark" style="font-family: serif; letter-spacing: -0.5px;">FastFood</h3>
                    <small class="text-muted fw-bold" style="letter-spacing: 2px; font-size: 0.65rem; text-transform: uppercase;">Express Delivery</small>
                </div>
            </a>
        </div>
    </div>
</header>

<div class="container mt-5 mb-auto">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            
            <div class="card auth-card shadow-sm border-0 p-4 p-md-5" style="border-radius: 16px;">
                
                <div class="text-center mb-4">
                    <div class="bg-light rounded-circle d-inline-flex justify-content-center align-items-center mb-3" style="width: 60px; height: 60px;">
                        <i class="bi bi-person-fill fs-2 text-secondary"></i>
                    </div>
                    <h3 class="fw-bold text-dark m-0">Bentornato!</h3>
                    <p class="text-muted small mt-1">Inserisci le tue credenziali per continuare</p>
                </div>

                <form id="login-form">
                    <div class="mb-3">
                        <label for="email" class="form-label text-muted small fw-bold mb-1">Indirizzo Email</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-0 text-muted"><i class="bi bi-envelope"></i></span>
                            <input type="email" class="form-control bg-light border-0 py-2 shadow-none" id="email" placeholder="es. mario@email.com" required>
                        </div>
                    </div>
                    
                    <div class="mb-4">
                        <label for="password" class="form-label text-muted small fw-bold mb-1">Password</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-0 text-muted"><i class="bi bi-lock"></i></span>
                            <input type="password" class="form-control bg-light border-0 py-2 shadow-none" id="password" placeholder="••••••••" required>
                        </div>
                    </div>
                    
                    <button type="submit" class="btn btn-danger w-100 fw-bold py-3 rounded-pill shadow-sm" style="transition: all 0.2s;">Accedi</button>
                </form>
                
                <hr class="my-4 opacity-25">
                
                <div class="text-center">
                    <p class="text-muted mb-2 small">Non hai ancora un account?</p>
                    <a href="register.html" class="btn btn-outline-secondary w-100 fw-bold py-2 rounded-pill" style="transition: all 0.2s;">Registrati ora</a>
                </div>
                
            </div>
            
        </div>
    </div>
</div>

<footer class="footer-fastfood mt-5 py-4" style="background-color: var(--dark-bg, #1a1e21);">
    <div class="container">
        <p class="m-0 text-center text-white opacity-75 small">Copyright &copy; FastFood Express 2026</p>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script type="module" src="js/auth.js"></script>
</body>
</html>
