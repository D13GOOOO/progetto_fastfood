<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fast Food Express - Menu</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark navbar-fastfood">
    <div class="container">
        <a class="navbar-brand fw-bold" href="index.html">FastFood Express</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link active" href="index.html">Menu</a></li>
                <li class="nav-item">
                    <a class="nav-link text-warning fw-bold" href="#" data-bs-toggle="offcanvas" data-bs-target="#carrelloOffcanvas">
                        Carrello <span id="contatore-carrello" class="badge bg-light text-dark ms-1">0</span>
                    </a>
                </li>
                <li class="nav-item dropdown" id="area-utente">
                    <a class="nav-link" href="login.html">Accedi</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<header class="hero-section">
    <div class="container text-center">
        <h1 class="display-4 fw-bolder">Ordina il tuo Hamburger preferito!</h1>
        <p class="lead text-muted">Veloce, caldo e direttamente a casa tua.</p>
    </div>
</header>

<div class="container">
    <div id="menu-container" class="row row-cols-1 row-cols-md-3 g-4">
        <div class="col-12 text-center">
            <div class="spinner-border text-danger" role="status"></div>
            <p class="mt-2">Stiamo preparando il menu per te...</p>
        </div>
    </div>
</div>

<div class="offcanvas offcanvas-end" tabindex="-1" id="carrelloOffcanvas">
    <div class="offcanvas-header offcanvas-fastfood-header">
        <h5 class="offcanvas-title fw-bold">Il tuo Ordine</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas"></button>
    </div>
    <div class="offcanvas-body d-flex flex-column">
        <ul id="lista-carrello" class="list-group mb-auto">
            <li class="list-group-item text-center text-muted my-4">Il carrello è ancora vuoto!</li>
        </ul>
        <div class="mt-4 border-top pt-3">
            <h5 class="d-flex justify-content-between fw-bold">
                <span>Totale:</span>
                <span id="totale-carrello">0.00 €</span>
            </h5>
            <button id="btn-paga" class="btn btn-success w-100 fw-bold py-2 mt-2">Procedi al Pagamento</button>
        </div>
    </div>
</div>

<footer class="footer-fastfood">
    <div class="container"><p class="m-0 text-center text-white">Copyright &copy; FastFood Express 2026</p></div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/app.js"></script>
</body>
</html>
