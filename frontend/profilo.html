<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Il mio Profilo - Fast Food Express</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="d-flex flex-column min-vh-100 bg-light">

<div class="top-bar py-1 d-none d-lg-block shadow-sm" style="background-color: var(--dark-bg, #1a1e21); position: relative; z-index: 1050;">
    <div class="container d-flex justify-content-between align-items-center">
        <ul class="nav top-nav-links">
            <li class="nav-item"><a href="index.html" class="nav-link text-light ps-0 pe-3 fw-medium">Home</a></li>
            <li class="nav-item"><a href="index.html" class="nav-link text-light px-3 fw-medium">Menu</a></li>
            <li class="nav-item"><a href="ristoranti.html" class="nav-link text-light px-3 fw-medium">Ristoranti</a></li>
        </ul>
        <div class="d-flex align-items-center" id="area-utente">
            <a href="login.html" class="text-light text-decoration-none fw-bold d-flex align-items-center gap-2">
                <i class="bi bi-person-circle fs-5"></i> Accedi
            </a>
        </div>
    </div>
</div>

<header class="main-header bg-white sticky-top py-3 border-bottom shadow-sm" style="z-index: 1040;">
    <div class="container d-flex justify-content-center justify-content-lg-between align-items-center">
        <div class="brand-center text-center">
            <a href="index.html" class="text-decoration-none d-flex align-items-center gap-2" title="Torna alla Home">
                <div class="logo-icon bg-danger text-white rounded-circle d-flex justify-content-center align-items-center" style="width: 45px; height: 45px;">
                    <i class="bi bi-shop fs-4"></i>
                </div>
                <div class="text-start">
                    <h3 class="m-0 fw-bold text-dark" style="font-family: serif; letter-spacing: -0.5px;">FastFood</h3>
                    <small class="text-muted fw-bold" style="letter-spacing: 2px; font-size: 0.65rem; text-transform: uppercase;">Express Delivery</small>
                </div>
            </a>
        </div>
    </div>
</header>

<div class="container mt-5 mb-auto">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-7">
            
            <div class="card shadow-sm border-0 p-4 p-md-5 mb-5" style="border-radius: 16px;">
                
                <div class="text-center mb-4 pb-3 border-bottom">
                    <div class="bg-primary bg-opacity-10 text-primary rounded-circle d-inline-flex justify-content-center align-items-center mb-3" style="width: 70px; height: 70px;">
                        <i class="bi bi-person-gear fs-1"></i>
                    </div>
                    <h3 class="fw-bold text-dark m-0">Impostazioni Profilo</h3>
                    <p class="text-muted small mt-1">Aggiorna i tuoi dati personali e le preferenze</p>
                </div>

                <form id="form-profilo">
                    
                    <h6 class="fw-bold text-muted text-uppercase mb-3" style="font-size: 0.8rem; letter-spacing: 1px;">Dati Personali</h6>
                    
                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label for="prof-nome" class="form-label text-muted small fw-bold mb-1">Nome</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-0 text-muted"><i class="bi bi-person"></i></span>
                                <input type="text" id="prof-nome" class="form-control bg-light border-0 py-2 shadow-none">
                            </div>
                        </div>
                        <div class="col-md-6">
                            <label for="prof-cognome" class="form-label text-muted small fw-bold mb-1">Cognome</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-0 text-muted"><i class="bi bi-person"></i></span>
                                <input type="text" id="prof-cognome" class="form-control bg-light border-0 py-2 shadow-none">
                            </div>
                        </div>
                    </div>
                    
                    <div class="mb-4">
                        <label for="prof-email" class="form-label text-muted small fw-bold mb-1">Email <span class="fw-normal text-muted">(Non modificabile)</span></label>
                        <div class="input-group opacity-75">
                            <span class="input-group-text bg-light border-0 text-muted"><i class="bi bi-envelope"></i></span>
                            <input type="email" id="prof-email" class="form-control bg-light border-0 py-2 shadow-none" disabled>
                        </div>
                    </div>

                    <h6 class="fw-bold text-muted text-uppercase mb-3 mt-5" style="font-size: 0.8rem; letter-spacing: 1px;">Spedizione e Preferenze</h6>

                    <div class="mb-3">
                        <label for="prof-indirizzo" class="form-label text-muted small fw-bold mb-1">Indirizzo di Consegna (Principale)</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-0 text-muted"><i class="bi bi-house"></i></span>
                            <input type="text" id="prof-indirizzo" class="form-control bg-light border-0 py-2 shadow-none" placeholder="Via Roma 1, Milano">
                        </div>
                    </div>
                    
                    <div class="row g-3 mb-3">
                        <div class="col-md-12">
                            <label for="prof-tipo-pag" class="form-label text-muted small fw-bold mb-1">Metodo di Pagamento Preferito</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-0 text-muted"><i class="bi bi-credit-card"></i></span>
                                <select id="prof-tipo-pag" class="form-select bg-light border-0 py-2 shadow-none">
                                    <option value="Contanti">Pagamento alla consegna (Contanti/POS)</option>
                                    <option value="Carta di Credito">Carta di Credito (Salvata)</option>
                                </select>
                            </div>
                        </div>
                    </div>
                    
                    <div class="mb-4">
                        <label for="prof-pref" class="form-label text-muted small fw-bold mb-1">Note / Preferenze Alimentari</label>
                        <textarea id="prof-pref" class="form-control bg-light border-0 py-2 shadow-none" rows="3" placeholder="Es. Senza cipolla, allergia alle noci, preferisco salse a parte..."></textarea>
                    </div>

                    <div class="mt-5 pt-4 border-top d-flex flex-column flex-sm-row justify-content-between align-items-center gap-3">
                        <button type="button" id="btn-elimina-account" class="btn btn-outline-danger fw-bold rounded-pill px-4 order-2 order-sm-1">
                            <i class="bi bi-trash me-2"></i>Elimina Profilo
                        </button>
                        <button type="submit" class="btn btn-primary fw-bold py-3 px-5 rounded-pill shadow-sm order-1 order-sm-2 w-100 w-sm-auto">
                            Salva Modifiche
                        </button>
                    </div>
                </form>
                
            </div>
            
        </div>
    </div>
</div>

<footer class="footer-fastfood mt-auto py-4" style="background-color: var(--dark-bg, #1a1e21);">
    <div class="container">
        <p class="m-0 text-center text-white opacity-75 small">Copyright &copy; FastFood Express 2026</p>
    </div>
</footer>

<div id="offcanvasUtente" class="d-none"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script type="module" src="js/init-app.js"></script> 
<script type="module" src="js/profilo.js"></script>
</body>
</html>
