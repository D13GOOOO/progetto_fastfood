<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ristoranti - Fast Food Express</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="d-flex flex-column min-vh-100">

<nav class="navbar navbar-expand-lg navbar-dark navbar-fastfood">
    <div class="container">
        <a class="navbar-brand fw-bold" href="index.html">FastFood Express</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="index.html">Menu Globale</a></li>
                <li class="nav-item"><a class="nav-link active" href="ristoranti.html">Ristoranti</a></li>
                <li class="nav-item">
                    <a class="nav-link text-warning fw-bold" href="#" data-bs-toggle="offcanvas" data-bs-target="#carrelloOffcanvas">
                        Carrello <span id="contatore-carrello" class="badge bg-light text-dark ms-1">0</span>
                    </a>
                </li>
                <li class="nav-item dropdown" id="area-utente">
                    <a class="nav-link" href="login.html">Accedi</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<header class="hero-section bg-light border-bottom">
    <div class="container text-center">
        <h1 class="display-5 fw-bolder">I nostri Ristoranti Partner</h1>
        <p class="lead text-muted">Trova il locale più vicino a te e scopri le loro specialità.</p>
    </div>
</header>

<div class="container mb-5 mt-n4 position-relative">
    <div class="card shadow border-0 p-3 bg-white rounded-3">
        <form id="form-ricerca-ristoranti" class="row g-3 align-items-end">
            <div class="col-md-5">
                <label for="filtro-nome-rest" class="form-label text-muted small fw-bold">Nome Ristorante</label>
                <input type="text" id="filtro-nome-rest" class="form-control" placeholder="Es. Burger King...">
            </div>
            <div class="col-md-5">
                <label for="filtro-luogo" class="form-label text-muted small fw-bold">Luogo o Indirizzo</label>
                <input type="text" id="filtro-luogo" class="form-control" placeholder="Es. Milano, Via Roma...">
            </div>
            <div class="col-md-2 d-flex gap-2">
                <button type="submit" class="btn btn-danger w-100 fw-bold" title="Cerca">Cerca 🔍</button>
            </div>
        </form>
    </div>
</div>

<div class="container">
    <div id="ristoranti-container" class="row row-cols-1 row-cols-md-3 g-4 mb-5">
        <div class="col-12 text-center">
            <div class="spinner-border text-primary" role="status"></div>
            <p class="mt-2">Ricerca ristoranti in corso...</p>
        </div>
    </div>
</div>

<footer class="footer-fastfood mt-auto">
    <div class="container"><p class="m-0 text-center text-white">Copyright &copy; FastFood Express 2026</p></div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/app.js"></script>
<script src="js/ristoranti.js"></script>
</body>
</html>
