<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ristoranti - Fast Food Express</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="d-flex flex-column min-vh-100 bg-light">

<div class="top-bar py-1 d-none d-lg-block shadow-sm" style="background-color: var(--dark-bg, #1a1e21); position: relative; z-index: 1050;">
    <div class="container d-flex justify-content-between align-items-center">
        <ul class="nav top-nav-links">
            <li class="nav-item"><a href="index.html" class="nav-link text-light ps-0 pe-3 fw-medium">Home</a></li>
            <li class="nav-item"><a href="index.html" class="nav-link text-light px-3 fw-medium">Menu</a></li>
            <li class="nav-item"><a href="ristoranti.html" class="nav-link text-light px-3 fw-medium">Ristoranti</a></li>
        </ul>
        <div class="d-flex align-items-center" id="area-utente">
            <a href="login.html" class="text-light text-decoration-none fw-bold d-flex align-items-center gap-2">
                <i class="bi bi-person-circle fs-5"></i> Accedi
            </a>
        </div>
    </div>
</div>

<header class="main-header bg-white sticky-top py-3 border-bottom shadow-sm" style="z-index: 1040;">
    <div class="container d-flex justify-content-between align-items-center">
        
        <div class="social-links d-none d-md-flex gap-4 text-muted fs-5" style="margin-left: -5px;"> 
            <a href="#" class="text-muted"><i class="bi bi-facebook"></i></a>
            <a href="#" class="text-muted"><i class="bi bi-instagram"></i></a>
            <a href="#" class="text-muted"><i class="bi bi-linkedin"></i></a>
            <a href="#" class="text-muted"><i class="bi bi-google"></i></a>
        </div>

        <div class="brand-center text-center">
            <a href="index.html" class="text-decoration-none d-flex align-items-center gap-2">
                <div class="logo-icon bg-danger text-white rounded-circle d-flex justify-content-center align-items-center" style="width: 45px; height: 45px;">
                    <i class="bi bi-shop fs-4"></i>
                </div>
                <div class="text-start">
                    <h3 class="m-0 fw-bold text-dark" style="font-family: serif; letter-spacing: -0.5px;">FastFood</h3>
                    <small class="text-muted fw-bold" style="letter-spacing: 2px; font-size: 0.65rem; text-transform: uppercase;">Express Delivery</small>
                </div>
            </a>
        </div>

        <div class="header-actions d-flex align-items-center gap-4">
            <a href="#collapseRicerca" class="text-dark text-decoration-none d-flex align-items-center" data-bs-toggle="collapse" role="button" aria-expanded="false" aria-controls="collapseRicerca" title="Cerca Ristorante">
                <div class="d-flex align-items-center justify-content-center" style="width: 28px; height: 28px;">
                    <i class="bi bi-search fs-4 m-0" style="line-height: 1;"></i>
                </div>
            </a>
            
            <div class="vr d-none d-md-block bg-secondary" style="height: 38px; width: 1.5px; opacity: 0.25;"></div>
            
            <a href="#carrelloOffcanvas" class="text-dark text-decoration-none d-flex align-items-center" data-bs-toggle="offcanvas" role="button" aria-controls="carrelloOffcanvas" title="Apri Carrello">
                <div class="position-relative d-flex align-items-center justify-content-center" style="width: 28px; height: 28px;">
                    <i class="bi bi-bag fs-4 m-0" style="line-height: 1;"></i>
                    <span id="contatore-carrello" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger shadow-sm" style="font-size: 0.65rem; margin-top: 2px;">0</span>
                </div>
            </a>
        </div>
    </div>
</header>

<div class="collapse" id="collapseRicerca">
    <div class="container mt-4 mb-2">
        <div class="card shadow-sm border-0 p-3 p-md-4 bg-white" style="border-radius: 16px;">
            <form id="form-ricerca-ristoranti" class="row g-3 align-items-end">
                <div class="col-md-5">
                    <label for="filtro-nome-rest" class="form-label text-muted small fw-bold ms-1">Nome Ristorante</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-0 text-muted"><i class="bi bi-shop"></i></span>
                        <input type="text" id="filtro-nome-rest" class="form-control bg-light border-0 py-2 shadow-none" placeholder="Es. Burger King...">
                    </div>
                </div>
                <div class="col-md-5">
                    <label for="filtro-luogo" class="form-label text-muted small fw-bold ms-1">Luogo o Indirizzo</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-0 text-muted"><i class="bi bi-geo-alt"></i></span>
                        <input type="text" id="filtro-luogo" class="form-control bg-light border-0 py-2 shadow-none" placeholder="Es. Milano, Via Roma...">
                    </div>
                </div>
                <div class="col-md-2">
                    <button type="submit" class="btn btn-danger w-100 fw-bold py-2 rounded-pill shadow-sm" title="Cerca">Cerca Ora</button>
                </div>
            </form>
        </div>
    </div>
</div>

<div class="container mt-5 mb-auto">
    
    <div class="d-flex align-items-center gap-3 mb-4">
        <div class="bg-success bg-opacity-10 text-success rounded-circle d-flex align-items-center justify-content-center shadow-sm" style="width: 50px; height: 50px;">
            <i class="bi bi-pin-map-fill fs-3"></i>
        </div>
        <div>
            <h3 class="fw-bold m-0 text-dark">I nostri Ristoranti Partner</h3>
            <p class="text-muted small m-0 mt-1">Scegli da chi ordinare e scopri il menu dedicato.</p>
        </div>
    </div>

    <div id="ristoranti-container" class="row g-4 mb-5">
        <div class="col-12 text-center py-5">
            <div class="spinner-border text-danger" role="status"></div>
            <p class="mt-3 text-muted fw-medium">Ricerca ristoranti in corso...</p>
        </div>
    </div>

</div>

<div class="offcanvas offcanvas-end border-0 shadow-lg" tabindex="-1" id="carrelloOffcanvas" aria-labelledby="carrelloLabel" style="z-index: 1060;">
    <div class="offcanvas-header border-bottom py-3">
        <h6 class="offcanvas-title fw-bold text-uppercase text-muted" id="carrelloLabel" style="letter-spacing: 1px; font-size: 0.8rem;">Il tuo Ordine</h6>
        <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
    </div>
    <div class="offcanvas-body d-flex flex-column bg-light p-0">
        <div class="p-3 mb-auto">
            <ul id="lista-carrello" class="list-group list-group-flush bg-transparent">
                <li class="list-group-item bg-transparent text-center text-muted my-4 border-0">Il carrello è ancora vuoto!</li>
            </ul>
        </div>
        <div class="mt-auto bg-white border-top p-4 shadow-sm">
            <h5 class="d-flex justify-content-between align-items-center fw-bold mb-3">
                <span class="text-muted fs-6">Totale:</span>
                <span id="totale-carrello" class="text-success fs-4">0.00 €</span>
            </h5>
            <button id="btn-paga" class="btn btn-danger w-100 fw-bold py-3 rounded-pill shadow-sm" style="transition: all 0.2s;">Procedi al Pagamento</button>
        </div>
    </div>
</div>

<footer class="footer-fastfood mt-auto py-4" style="background-color: var(--dark-bg, #1a1e21);">
    <div class="container">
        <p class="m-0 text-center text-white opacity-75 small">Copyright &copy; FastFood Express 2026</p>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/app.js"></script>
<script src="js/ristoranti.js"></script>
</body>
</html>
