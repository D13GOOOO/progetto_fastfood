<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ristoranti - Fast Food Express</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="d-flex flex-column min-vh-100">

<nav class="navbar navbar-expand-lg navbar-dark navbar-fastfood">
    <div class="container">
        <a class="navbar-brand fw-bold" href="index.html">FastFood Express</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="index.html">Menu Globale</a></li>
                <li class="nav-item"><a class="nav-link active" href="ristoranti.html">Ristoranti</a></li>
                <li class="nav-item">
                    <a class="nav-link text-warning fw-bold" href="#" data-bs-toggle="offcanvas" data-bs-target="#carrelloOffcanvas">
                        Carrello <span id="contatore-carrello" class="badge bg-light text-dark ms-1">0</span>
                    </a>
                </li>
                <li class="nav-item dropdown" id="area-utente">
                    <a class="nav-link" href="login.html">Accedi</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<header class="container mt-5 mb-4 d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3">
    <div>
        <h2 class="fw-bold mb-0 fs-2" style="color: var(--text-main);">I nostri Ristoranti Partner</h2>
        <p class="text-muted mb-0">Trova il locale più vicino a te e scopri le specialità.</p>
    </div>
    <button class="btn btn-outline-secondary bg-white border rounded-pill px-4 py-2 shadow-sm text-muted d-flex justify-content-between align-items-center" type="button" data-bs-toggle="collapse" data-bs-target="#collapseRicerca" aria-expanded="false" aria-controls="collapseRicerca" style="width: 250px;">
        <span>Cerca ristorante...</span>
        <span>▼</span>
    </button>
</header>

<div class="collapse" id="collapseRicerca">
    <div class="container pb-4">
        <div class="card shadow-sm border-0 p-4 bg-white rounded-3">
            <form id="form-ricerca-ristoranti" class="row g-3 align-items-end">
                <div class="col-md-5">
                    <label for="filtro-nome-rest" class="form-label text-muted small fw-bold">Nome Ristorante</label>
                    <input type="text" id="filtro-nome-rest" class="form-control" placeholder="Es. Burger King...">
                </div>
                <div class="col-md-5">
                    <label for="filtro-luogo" class="form-label text-muted small fw-bold">Luogo o Indirizzo</label>
                    <input type="text" id="filtro-luogo" class="form-control" placeholder="Es. Milano, Via Roma...">
                </div>
                <div class="col-md-2 d-flex gap-2">
                    <button type="submit" class="btn btn-danger w-100 fw-bold" title="Cerca">Vai</button>
                </div>
            </form>
        </div>
    </div>
</div>

<div class="container">
    <div id="ristoranti-container" class="row row-cols-1 row-cols-md-3 g-4 mb-5">
        <div class="col-12 text-center">
            <div class="spinner-border text-primary" role="status"></div>
            <p class="mt-2">Ricerca ristoranti in corso...</p>
        </div>
    </div>
</div>

<div class="offcanvas offcanvas-end" tabindex="-1" id="carrelloOffcanvas" aria-labelledby="carrelloLabel">
    <div class="offcanvas-header offcanvas-fastfood-header">
        <h5 class="offcanvas-title fw-bold" id="carrelloLabel">Il tuo Ordine</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas" aria-label="Close"></button>
    </div>
    <div class="offcanvas-body d-flex flex-column">
        <ul id="lista-carrello" class="list-group mb-auto">
            <li class="list-group-item text-center text-muted my-4">Il carrello è ancora vuoto!</li>
        </ul>
        <div class="mt-4 border-top pt-3">
            <h5 class="d-flex justify-content-between fw-bold">
                <span>Totale:</span>
                <span id="totale-carrello">0.00 €</span>
            </h5>
            <button id="btn-paga" class="btn btn-success w-100 fw-bold py-2 mt-2">Procedi al Pagamento</button>
        </div>
    </div>
</div>

<footer class="footer-fastfood mt-auto">
    <div class="container"><p class="m-0 text-center text-white">Copyright &copy; FastFood Express 2026</p></div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/app.js"></script>
<script src="js/ristoranti.js"></script>
</body>
</html>
